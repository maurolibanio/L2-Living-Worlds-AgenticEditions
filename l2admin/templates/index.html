<!DOCTYPE html>
<html><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1.0\"><title>L2ControlPanel</title><link href=\"https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css\" rel=\"stylesheet\"><style>:root{--bg-dark:#0f1117;--bg-card:#1a1d2e;--text-primary:#e4e6ef;--text-secondary:#9299bb;--accent:#6366f1}*
{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystem,\"Segoe UI\",sans-serif;background:var(--bg-dark);color:var(--text-primary);min-height:100vh}.header{background:linear-gradient(135deg,#1a1d2e,#212540);border-bottom:1px solid rgba(99,102,241,0.2);padding:20px 0;position:sticky;top:0;z-index:100}.header-inner{margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between}.header h1{font-size:22px;font-weight:700}.header h1 span{color:var(--accent)}.status-badge{padding:4px 12px;border-radius:20px;background:rgba(34,197,94,0.12);color:var(--green);font-size:13px}.status-badge.offline{background:rgba(239,68,68,0.12);color:var(--red)}.container{max-width:1200px;margin:0 auto;padding:24px 20px}.category-card{background:var(--bg-card);border-radius:16px;border:1px solid rgba(99,102,241,0.1);margin-bottom:16px}.category-header{padding:16px 20px;display:flex;align-items:center;gap:12px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.05)}.category-header h2{font-size:15px;font-weight:600}.category-body{padding:0 20px 16px;display:none}.category-body.open{display:block}.feature-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.04)}.feature-name{font-size:14px;font-weight:500}.feature-desc{font-size:12px;color:var(--text-secondary)}.toggle{position:relative;width:44px;height:24px;cursor:pointer;display:inline-block}.toggle input{display:none}.toggle .slider{position:absolute;inset:0;background:#374151;border-radius:12px;transition:background 0.25s}.toggle .slider::before{content:\"\";position:absolute;width:18px;height:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:transform 0.25s}.toggle input:checked+.slider{background:var(--accent)}.toggle input:checked+.slider::before{transform:translateX(20px)}.range-control{display:flex;align-items:center;gap:9px}.range-control input{width:100px}.range-control .value{font-size:13px;font-weight:600;color:var(--accent)}.info-status{font-size:12px;padding:2px 8px;border-radius:6px;background:rgba(34,197,94,0.1);color:var(--green)}.info-status.disabled{background:rgba(239,68,68,0.1);color:var(--red)}.save-bar{position:sticky;bottom:0;background:linear-gradient(135deg,#1a1d2e,#212540);border-top:1px solid rgba(99,102,241,0.2);padding:16px 20px;text-align:center}.btn-save{background:var(--accent);color:#fff;border:none;padding:12px 32px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}.btn-save:disabled{opacity:0.5}#svSt{font-size:13px;color:var(--text-secondary)}#svSt.done{color:var(--green)}#svSt.error{color:var(--red)}#svSt.saving{color:var(--orange)}
</style></head><body><div class=\"header\"><div class=\"header-inner\"><h1>L2ControlPanel</h1><div class=\"status-badge\" id=\"stBadge\"><span id=\"stDot\">*</span><span id=\"stTxt\">Checking</span></div></div></div><div class=\"container\">{let x} </div><div class=\"save-bar\"><button class=\"btn-save\" id=\"svBtn\" onclick=\"sv()\">Save</button><span id=\"svSt\">Changes require restart</span></div><script>function void(0){}</script></body></html>
